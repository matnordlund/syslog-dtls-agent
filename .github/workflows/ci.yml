name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf perl pkg-config
      - name: Windows native build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install strawberryperl nasm --no-progress -y
          "C:\Strawberry\perl\bin" >> $env:GITHUB_PATH
          "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: npm run test:ui
      - run: cargo build --locked -p syslog-agent-cli
      - name: DTLS interoperability (Linux)
        if: runner.os == 'Linux'
        run: python3 tests/interop.py
      - name: DTLS interoperability (macOS)
        if: runner.os == 'macOS'
        run: OPENSSL_BIN="$(brew --prefix openssl@3)/bin/openssl" python3 tests/interop.py
      - name: Desktop build (no signing or publishing)
        run: npm run desktop:build -- --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            target/debug/syslog-dtls-agent
            target/debug/syslog-dtls-agent.exe
            target/release/syslog-agent-desktop
            target/release/syslog-agent-desktop.exe
          if-no-files-found: error
