[workspace]
members = ["crates/core", "crates/dtls-openssl", "crates/cli", "crates/desktop"]
default-members = ["crates/core", "crates/dtls-openssl", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
syslog-agent-core = { path = "crates/core" }
syslog-agent-dtls-openssl = { path = "crates/dtls-openssl" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
openssl = "0.10.81"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

